name: Add SSH Key to EC2

on:
  workflow_dispatch:

jobs:
  add-key:
    name: Add Claude-code-key to EC2 authorized_keys
    runs-on: ubuntu-latest
    steps:
      - name: Add public key via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "ssh-rsa  Claude-code-key" >> ~/.ssh/authorized_keys
            echo "Key added successfully"
            tail -1 ~/.ssh/authorized_keys
